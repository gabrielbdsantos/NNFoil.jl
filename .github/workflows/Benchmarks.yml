name: Benchmarks

on:
  # pull_request_target:
  #   branches:
  #     - main
  workflow_dispatch:

permissions:
  pull-requests: write

jobs:
  bench:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ["1.10", "1.11", "1.12"]
    steps:
      - uses: MilesCranmer/AirspeedVelocity.jl@action-v1
        with:
          julia-version: ${{ matrix.version }}
          bench-on: ${{ github.event.pull_request.head.sha || github.sha }}
