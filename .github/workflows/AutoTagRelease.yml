name: Auto Tag Release

on:
  pull_request:
    types:
      - closed

permissions:
  contents: write

jobs:
  tag-release:
    if: ${{ github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main' && startsWith(github.event.pull_request.head.ref, 'release/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate release branch format
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          if [[ ! "$BRANCH_NAME" =~ ^release/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release branch: $BRANCH_NAME"
            echo "Expected format: release/vX.Y.Z (e.g. release/v1.2.3)"
            exit 1
          fi

      - name: Create tag from merged release PR
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = context.payload.pull_request.head.ref;
            const tag = branch.replace('release/', '');
            const sha = context.payload.pull_request.merge_commit_sha;

            try {
              await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
              core.info(`Tag ${tag} already exists. Skipping.`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            await github.rest.git.createRef({
              owner,
              repo,
              ref: `refs/tags/${tag}`,
              sha,
            });

            core.info(`Created tag ${tag} at ${sha}`);
